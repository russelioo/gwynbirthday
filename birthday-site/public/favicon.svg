<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1f103d"/>
      <stop offset="50%" stopColor="#140a28"/>
      <stop offset="100%" stopColor="#0b0517"/>
    </linearGradient>

    <!-- Penguin Body Gradient -->
    <linearGradient id="bodyGrad" x1="50" y1="14" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3b2569"/>
      <stop offset="60%" stopColor="#231545"/>
      <stop offset="100%" stopColor="#120a24"/>
    </linearGradient>

    <!-- Belly Gradient -->
    <linearGradient id="bellyGrad" x1="50" y1="36" x2="50" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="85%" stopColor="#F1F5F9"/>
      <stop offset="100%" stopColor="#E2E8F0"/>
    </linearGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="30" y1="45" x2="70" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F472B6"/>
      <stop offset="100%" stopColor="#DB2777"/>
    </linearGradient>

    <!-- Beak & Feet Gradient -->
    <linearGradient id="beakFeetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Squircle App/Favicon Background with subtle Pink Glow -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="25" fill="none" stroke="#F472B6" stroke-width="1.8" stroke-opacity="0.45"/>

  <!-- Golden Feet -->
  <ellipse cx="40" cy="87" rx="8.5" ry="4.5" fill="url(#beakFeetGrad)"/>
  <ellipse cx="60" cy="87" rx="8.5" ry="4.5" fill="url(#beakFeetGrad)"/>

  <!-- Tuxedo Body -->
  <path d="M50 14 C33 14 24 32 24 56 C24 79 32 87 50 87 C68 87 76 79 76 56 C76 32 67 14 50 14 Z" fill="url(#bodyGrad)"/>

  <!-- Left Flipper -->
  <path d="M25 48 C16 54 14 69 22 75 C26 71 29 60 27 50 Z" fill="#1c1136"/>

  <!-- Right Flipper (Cute Wave) -->
  <path d="M75 48 C86 41 91 27 85 21 C78 27 73 38 75 48 Z" fill="#2d1c52"/>

  <!-- White Belly -->
  <path d="M50 36 C38 36 34 49 34 68 C34 81 41 85 50 85 C59 85 66 81 66 68 C66 49 62 36 50 36 Z" fill="url(#bellyGrad)"/>

  <!-- Scarf Wrap -->
  <rect x="31" y="45" width="38" height="10" rx="5" fill="url(#scarfGrad)"/>
  <path d="M36 47 Q50 50 64 47" stroke="#FBCFE8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Scarf Tail -->
  <path d="M57 50 L63 72 C63 74 58 75 56 74 L53 50 Z" fill="#BE185D"/>
  <line x1="57" y1="74" x2="56" y2="78" stroke="#FBCFE8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="59.5" y1="74" x2="59.5" y2="78.5" stroke="#FBCFE8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="62" y1="73.5" x2="63" y2="78" stroke="#FBCFE8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Cheerful Blushing Cheeks -->
  <ellipse cx="37" cy="36" rx="4.5" ry="2.8" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="63" cy="36" rx="4.5" ry="2.8" fill="#F472B6" opacity="0.6"/>

  <!-- Expressive Sparkly Eyes -->
  <circle cx="43" cy="31" r="3.6" fill="#0F091E"/>
  <circle cx="41.8" cy="29.8" r="1.3" fill="#FFFFFF"/>
  <circle cx="44.2" cy="32.2" r="0.6" fill="#FFFFFF"/>

  <circle cx="57" cy="31" r="3.6" fill="#0F091E"/>
  <circle cx="55.8" cy="29.8" r="1.3" fill="#FFFFFF"/>
  <circle cx="58.2" cy="32.2" r="0.6" fill="#FFFFFF"/>

  <!-- Golden Beak -->
  <path d="M45.5 34.5 Q50 41 54.5 34.5 Q50 37.5 45.5 34.5 Z" fill="url(#beakFeetGrad)"/>

  <!-- Tiny Floating Heart next to waving flipper -->
  <path d="M85 14 C85 11.5 82.5 9.5 80.5 11.5 C78.5 9.5 76 11.5 76 14 C76 17.5 80.5 20.5 80.5 20.5 C80.5 20.5 85 17.5 85 14 Z" fill="#F472B6"/>
</svg>
